[project]
name = "hkjc-predictor"
version = "0.1.0"
description = "Private-research collector and database for Hong Kong Jockey Club local race results."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
]

[project.scripts]
hkjc = "hkjc_predictor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: fetches the public HKJC website (slow, needs network)",
]
addopts = "-ra"
